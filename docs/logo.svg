<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>

    <!-- Emerald / Cyan Neon Glow -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e231d" />
      <stop offset="100%" stop-color="#050f0c" />
    </linearGradient>

    <!-- Filters -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="96" fill="url(#avatarBg)" />
  <rect x="4" y="4" width="504" height="504" rx="92" fill="none" stroke="rgba(16, 185, 129, 0.3)" stroke-width="4" />

  <!-- Radar Rings -->
  <circle cx="256" cy="220" r="160" fill="none" stroke="rgba(16, 185, 129, 0.08)" stroke-width="1.5" />
  <circle cx="256" cy="220" r="120" fill="none" stroke="rgba(6, 182, 212, 0.15)" stroke-width="1.5" stroke-dasharray="6,8" />
  
  <!-- Crosshairs -->
  <line x1="256" y1="40" x2="256" y2="400" stroke="rgba(16, 185, 129, 0.15)" stroke-width="1.5" stroke-dasharray="4,6" />
  <line x1="76" y1="220" x2="436" y2="220" stroke="rgba(16, 185, 129, 0.15)" stroke-width="1.5" stroke-dasharray="4,6" />

  <!-- Shield Shape -->
  <g transform="translate(256, 220)">
    <path d="M 0 -115 L 92 -65 L 92 40 C 92 95, 0 135, 0 135 C 0 135, -92 95, -92 40 L -92 -65 Z" 
          fill="url(#shieldFill)" stroke="#10b981" stroke-width="4.5" filter="url(#iconGlow)" opacity="0.7" />
    <path d="M 0 -115 L 92 -65 L 92 40 C 92 95, 0 135, 0 135 C 0 135, -92 95, -92 40 L -92 -65 Z" 
          fill="url(#shieldFill)" stroke="#10b981" stroke-width="4.5" />

    <!-- Inner Shield Line -->
    <path d="M 0 -98 L 74 -55 L 74 35 C 74 80, 0 115, 0 115 C 0 115, -74 80, -74 35 L -74 -55 Z" 
          fill="none" stroke="rgba(6, 182, 212, 0.45)" stroke-width="2" stroke-dasharray="8,6" />

    <!-- Tactical Compass Star -->
    <!-- North Arrow -->
    <polygon points="0,-82 15,-20 0,-34" fill="#10b981" />
    <polygon points="0,-82 -15,-20 0,-34" fill="#059669" />
    <!-- South Arrow -->
    <polygon points="0,75 13,20 0,30" fill="#06b6d4" />
    <polygon points="0,75 -13,20 0,30" fill="#0891b2" />
    <!-- East Arrow -->
    <polygon points="75,0 20,13 30,0" fill="#10b981" />
    <polygon points="75,0 20,-13 30,0" fill="#059669" />
    <!-- West Arrow -->
    <polygon points="-75,0 -20,13 -30,0" fill="#06b6d4" />
    <polygon points="-75,0 -20,-13 -30,0" fill="#0891b2" />

    <!-- Core Ring & Dot -->
    <circle cx="0" cy="0" r="18" fill="#050f0c" stroke="#10b981" stroke-width="3" />
    <circle cx="0" cy="0" r="7" fill="#34d399" filter="url(#iconGlow)" />
  </g>

  <!-- Typography at bottom -->
  <text x="256" y="420" font-family="'Segoe UI', 'Arial Black', Impact, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="0.1em" text-anchor="middle">
    NOMAD
  </text>
  <rect x="176" y="440" width="160" height="26" rx="6" fill="url(#neonGlow)" />
  <text x="256" y="458" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#05140e" letter-spacing="0.12em" text-anchor="middle">
    BRASIL 🇧🇷
  </text>
</svg>
