<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>

    <!-- Emerald / Cyan Neon Glow -->
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2620" />
      <stop offset="100%" stop-color="#06120e" />
    </linearGradient>

    <!-- Filters for High-Tech Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="tacticalGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(16, 185, 129, 0.05)" stroke-width="1" />
      <circle cx="0" cy="0" r="1.5" fill="rgba(16, 185, 129, 0.15)" />
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="380" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="380" fill="url(#tacticalGrid)" rx="16" />

  <!-- Outer Tactical Border & Corner Brackets -->
  <rect x="2" y="2" width="1196" height="376" fill="none" stroke="rgba(16, 185, 129, 0.25)" stroke-width="2" rx="14" />
  
  <!-- Corner Tech Reticles -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#10b981" stroke-width="3" />
  <path d="M 1180 50 L 1180 20 L 1150 20" fill="none" stroke="#10b981" stroke-width="3" />
  <path d="M 20 330 L 20 360 L 50 360" fill="none" stroke="#10b981" stroke-width="3" />
  <path d="M 1180 330 L 1180 360 L 1150 360" fill="none" stroke="#10b981" stroke-width="3" />

  <!-- Ambient Radar Glow Behind Emblem -->
  <circle cx="210" cy="190" r="130" fill="none" stroke="rgba(16, 185, 129, 0.08)" stroke-width="1" />
  <circle cx="210" cy="190" r="95" fill="none" stroke="rgba(6, 182, 212, 0.12)" stroke-width="1" stroke-dasharray="4,6" />
  <circle cx="210" cy="190" r="60" fill="none" stroke="rgba(16, 185, 129, 0.15)" stroke-width="1" />

  <!-- Tactical Radar Sweep lines -->
  <line x1="80" y1="190" x2="340" y2="190" stroke="rgba(16, 185, 129, 0.18)" stroke-width="1" stroke-dasharray="2,4" />
  <line x1="210" y1="60" x2="210" y2="320" stroke="rgba(16, 185, 129, 0.18)" stroke-width="1" stroke-dasharray="2,4" />

  <!-- ================= EMBLEM / SHIELD ================= -->
  <g transform="translate(210, 190)">
    <!-- Shield Outer Glow -->
    <path d="M 0 -85 L 68 -48 L 68 30 C 68 68, 0 95, 0 95 C 0 95, -68 68, -68 30 L -68 -48 Z" 
          fill="url(#shieldGrad)" stroke="#10b981" stroke-width="3" filter="url(#glow)" opacity="0.6" />
    <path d="M 0 -85 L 68 -48 L 68 30 C 68 68, 0 95, 0 95 C 0 95, -68 68, -68 30 L -68 -48 Z" 
          fill="url(#shieldGrad)" stroke="#10b981" stroke-width="3" />

    <!-- Inner Shield Inset -->
    <path d="M 0 -72 L 54 -40 L 54 26 C 54 58, 0 80, 0 80 C 0 80, -54 58, -54 26 L -54 -40 Z" 
          fill="none" stroke="rgba(6, 182, 212, 0.5)" stroke-width="1.5" stroke-dasharray="8,4" />

    <!-- Tactical Compass Star / Crosshair -->
    <!-- North Arrow -->
    <polygon points="0,-60 11,-15 0,-25" fill="#10b981" />
    <polygon points="0,-60 -11,-15 0,-25" fill="#059669" />
    <!-- South Arrow -->
    <polygon points="0,55 9,15 0,22" fill="#06b6d4" />
    <polygon points="0,55 -9,15 0,22" fill="#0891b2" />
    <!-- East Arrow -->
    <polygon points="55,0 15,9 22,0" fill="#10b981" />
    <polygon points="55,0 15,-9 22,0" fill="#059669" />
    <!-- West Arrow -->
    <polygon points="-55,0 -15,9 -22,0" fill="#06b6d4" />
    <polygon points="-55,0 -15,-9 -22,0" fill="#0891b2" />

    <!-- Center Coordinate Ring -->
    <circle cx="0" cy="0" r="14" fill="#06120e" stroke="#10b981" stroke-width="2.5" />
    <circle cx="0" cy="0" r="5" fill="#34d399" filter="url(#subtleGlow)" />

    <!-- Coordinate Marks -->
    <text x="0" y="-45" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="9" fill="#34d399" text-anchor="middle">N</text>
    <text x="0" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="8" fill="#38bdf8" text-anchor="middle">S</text>
    <text x="44" y="3" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="8" fill="#34d399" text-anchor="middle">L</text>
    <text x="-44" y="3" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="8" fill="#38bdf8" text-anchor="middle">O</text>
  </g>

  <!-- ================= TYPOGRAPHY & BRANDING ================= -->
  <g transform="translate(400, 0)">
    
    <!-- Top Pill Badges -->
    <g transform="translate(0, 92)">
      <!-- Brasil Pill -->
      <rect x="0" y="0" width="135" height="28" rx="6" fill="url(#badgeGrad)" />
      <text x="14" y="19" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#04160e" letter-spacing="0.1em">BRASIL 🇧🇷</text>

      <!-- Offline Autonomous Tag -->
      <rect x="145" y="0" width="160" height="28" rx="6" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
      <circle cx="160" cy="14" r="4" fill="#10b981" filter="url(#subtleGlow)" />
      <text x="172" y="18" font-family="'Segoe UI', Roboto, monospace" font-size="11" font-weight="700" fill="#34d399" letter-spacing="0.08em">100% OFFLINE</text>

      <!-- Open Source Tag -->
      <rect x="315" y="0" width="135" height="28" rx="6" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1" />
      <text x="382" y="18" font-family="'Segoe UI', Roboto, monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.08em" text-anchor="middle">OPEN SOURCE</text>
    </g>

    <!-- Main Title: NOMAD -->
    <text x="0" y="195" font-family="'Segoe UI', 'Arial Black', Impact, sans-serif" font-size="94" font-weight="900" fill="#ffffff" letter-spacing="0.06em">
      NOMAD
    </text>
    
    <!-- Title Accent Bar -->
    <rect x="390" y="132" width="14" height="64" fill="url(#neonEmerald)" rx="3" filter="url(#subtleGlow)" />

    <!-- Subtitle / Mission -->
    <text x="0" y="240" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#94a3b8" letter-spacing="0.04em">
      Central de Sobrevivência, Mapas Vetoriais &amp; Conhecimento
    </text>

    <!-- Feature Pillars -->
    <g transform="translate(0, 275)">
      <!-- Item 1 -->
      <circle cx="6" cy="10" r="3" fill="#10b981" />
      <text x="18" y="15" font-family="'Segoe UI', Roboto, monospace" font-size="13" font-weight="600" fill="#cbd5e1">5.571 Cidades IBGE</text>

      <!-- Item 2 -->
      <circle cx="180" cy="10" r="3" fill="#06b6d4" />
      <text x="192" y="15" font-family="'Segoe UI', Roboto, monospace" font-size="13" font-weight="600" fill="#cbd5e1">Wikipédia PT (23 GB)</text>

      <!-- Item 3 -->
      <circle cx="365" cy="10" r="3" fill="#10b981" />
      <text x="377" y="15" font-family="'Segoe UI', Roboto, monospace" font-size="13" font-weight="600" fill="#cbd5e1">Rotas &amp; GPX</text>

      <!-- Item 4 -->
      <circle cx="495" cy="10" r="3" fill="#06b6d4" />
      <text x="507" y="15" font-family="'Segoe UI', Roboto, monospace" font-size="13" font-weight="600" fill="#cbd5e1">Protocolos de Emergência</text>
    </g>

    <!-- Bottom Telemetry Line -->
    <line x1="0" y1="315" x2="720" y2="315" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="0" y="335" font-family="'Courier New', Courier, monospace" font-size="11" fill="rgba(16, 185, 129, 0.6)" letter-spacing="0.1em">
      SYS.VER 2.5 // COORD: -14.2350, -51.9253 // ZERO-NET RESILIENT PLATFORM
    </text>
  </g>
</svg>
